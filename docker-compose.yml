services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8999}:${APP_PORT:-8999}"
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT:-8999}
    volumes:
      - app_data:/app/data
      - app_media:/app/media
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('APP_PORT', '8999') + '/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-spoton_cleaning}
      POSTGRES_USER: ${DB_USER:-spoton}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spoton} -d ${DB_NAME:-spoton_cleaning}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  app_media:
  postgres_data:
