services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8999}:${APP_PORT:-8999}"
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT:-8999}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('APP_PORT', '8999') + '/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional — only if you do NOT have Postgres on the Ubuntu host already.
  # Start with: docker compose --profile bundled-db up -d
  db:
    profiles: ["bundled-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DB_PUBLISH_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-spotoncleaning}
      POSTGRES_USER: ${DB_USER:-spoton}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spoton} -d ${DB_NAME:-spotoncleaning}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_media:
  postgres_data:
