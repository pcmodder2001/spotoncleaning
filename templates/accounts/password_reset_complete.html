{% extends 'base.html' %}

{% block title %}Password Reset Complete - {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="auth-card card border-0 shadow p-5">
                    <i class="bi bi-check-circle text-success fs-1 mb-3"></i>
                    <h2 class="fw-bold">Password Reset Complete</h2>
                    <p class="text-muted">Your password has been set. You can now log in with your new password.</p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
