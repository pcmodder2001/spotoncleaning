{% extends 'base.html' %}

{% block title %}Set New Password - {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="auth-card card border-0 shadow">
                    <div class="card-body p-5">
                        <h2 class="fw-bold text-center mb-4">Set New Password</h2>
                        <form method="post">
                            {% csrf_token %}
                            {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
                            </div>
                            {% endfor %}
                            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
