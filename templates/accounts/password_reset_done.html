{% extends 'base.html' %}

{% block title %}Reset Email Sent - {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="auth-card card border-0 shadow p-5">
                    <i class="bi bi-envelope-check text-primary fs-1 mb-3"></i>
                    <h2 class="fw-bold">Check Your Email</h2>
                    <p class="text-muted">If an account exists with the email you entered, we've sent password reset instructions.</p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Return to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
