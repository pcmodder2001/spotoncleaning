<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Inter, Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #dc3545;">Booking Cancelled</h2>
        <p>Hi {{ booking.user.first_name }},</p>
        <p>Your booking for {{ booking.service_summary }} on {{ booking.date|date:"l, d F Y" }} at {{ booking.time_slot.time|time:"H:i" }} has been cancelled.</p>
        <p>If you have any questions, please contact us.</p>
        <p>Best regards,<br>The {{ site_name }} Team</p>
    </div>
</body>
</html>
