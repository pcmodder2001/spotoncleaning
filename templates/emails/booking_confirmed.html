<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Inter, Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #198754;">Booking Confirmed</h2>
        <p>Hi {{ booking.user.first_name }},</p>
        <p>Great news! Your booking has been confirmed.</p>
        <p><strong>{{ booking.service_summary }}</strong> on {{ booking.date|date:"l, d F Y" }} at {{ booking.time_slot.time|time:"H:i" }}.</p>
        <p>Address: {{ booking.full_address }}</p>
        <p>Best regards,<br>The {{ site_name }} Team</p>
    </div>
</body>
</html>
