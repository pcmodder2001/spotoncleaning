{% load static %}
<meta name="description" content="{% block meta_description %}{{ SITE_DESCRIPTION }}{% endblock %}">
<meta name="keywords" content="{% block meta_keywords %}{{ SITE_KEYWORDS }}{% endblock %}">
<meta name="author" content="{{ SITE_NAME }}">
<meta name="robots" content="{% block meta_robots %}index, follow{% endblock %}">
<link rel="canonical" href="{% block canonical_url %}{{ request.scheme }}://{{ request.get_host }}{{ request.path }}{% endblock %}">

<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:site_name" content="{{ SITE_NAME }}">
<meta property="og:title" content="{% block og_title %}{{ SITE_DEFAULT_SEO_TITLE }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ SITE_DESCRIPTION }}{% endblock %}">
<meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
<meta property="og:locale" content="en_GB">
<meta property="og:image" content="{% block og_image %}{{ SITE_URL }}{% static 'img/logo.png' %}{% endblock %}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% block twitter_title %}{{ SITE_DEFAULT_SEO_TITLE }}{% endblock %}">
<meta name="twitter:description" content="{% block twitter_description %}{{ SITE_DESCRIPTION }}{% endblock %}">
<meta name="twitter:image" content="{% block twitter_image %}{{ SITE_URL }}{% static 'img/logo.png' %}{% endblock %}">

<meta name="theme-color" content="#0e7490">
