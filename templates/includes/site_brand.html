{% load static_version %}
<a href="{% if brand_url %}{{ brand_url }}{% else %}{% url 'website:home' %}{% endif %}" class="site-brand{% if brand_class %} {{ brand_class }}{% endif %}">
    <img
        src="{% static_v 'img/logo.png' %}"
        alt="{{ SITE_NAME }}"
        class="site-brand-logo{% if logo_variant == 'nav' %} site-brand-logo--nav{% endif %}"
        width="{% if logo_variant == 'nav' %}140{% else %}68{% endif %}"
        height="{% if logo_variant == 'nav' %}140{% else %}68{% endif %}"
    >
</a>
