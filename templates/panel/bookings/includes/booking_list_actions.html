{% if can_manage_site and booking.status != 'cancelled' %}
<form method="post"
      action="{% url 'panel:booking_cancel' booking.pk %}"
      class="d-inline"
      data-confirm="The customer will be notified by email."
      data-confirm-title="Cancel booking #{{ booking.pk }}?"
      data-confirm-yes="Yes, cancel booking"
      data-confirm-danger="true">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="btn btn-sm btn-outline-danger">Cancel</button>
</form>
{% endif %}
{% if can_manage_site and booking.status == 'pending' %}
<form method="post"
      action="{% url 'panel:booking_confirm' booking.pk %}"
      class="d-inline"
      data-confirm="A confirmation email will be sent to {{ booking.contact_email }}."
      data-confirm-title="Confirm booking #{{ booking.pk }}?"
      data-confirm-yes="Yes, confirm">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="btn btn-sm btn-success">Confirm</button>
</form>
{% endif %}
{% if is_sysadmin %}
<form method="post"
      action="{% url 'panel:booking_delete' booking.pk %}"
      class="d-inline"
      data-confirm="Booking #{{ booking.pk }} for {{ booking.contact_full_name }} will be permanently removed."
      data-confirm-title="Delete booking #{{ booking.pk }}?"
      data-confirm-yes="Yes, delete"
      data-confirm-danger="true">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
</form>
{% endif %}
