{% if booking.discount_amount %}
<div class="booking-price-line text-muted small">Subtotal £{{ booking.total_price }}</div>
<div class="booking-price-line text-success small">−£{{ booking.discount_amount }}{% if booking.promo_code %} ({{ booking.promo_code.code }}){% else %} discount{% endif %}</div>
<div class="booking-price-line fw-semibold">£{{ booking.discounted_total }}</div>
{% else %}
<span class="fw-semibold">£{{ booking.total_price }}</span>
{% endif %}
