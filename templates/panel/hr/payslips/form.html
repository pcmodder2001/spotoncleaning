{% extends 'panel/base_panel.html' %}

{% block panel_title %}Add payslip{% endblock %}

{% block panel_content %}
{% include 'panel/hr/includes/hr_nav.html' %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="panel-card card border-0">
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Employee</label>
                            <select name="employee" class="form-select" required>
                                {% for member in staff %}
                                <option value="{{ member.pk }}">{{ member.full_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Reference</label>
                            <input type="text" name="reference" class="form-control" placeholder="Optional payslip ref">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Period start</label>
                            <input type="date" name="period_start" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Period end</label>
                            <input type="date" name="period_end" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Pay date</label>
                            <input type="date" name="pay_date" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Gross pay (£)</label>
                            <input type="number" step="0.01" min="0" name="gross_pay" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Income tax (£)</label>
                            <input type="number" step="0.01" min="0" name="income_tax" class="form-control" value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">National Insurance (£)</label>
                            <input type="number" step="0.01" min="0" name="national_insurance" class="form-control" value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Pension (£)</label>
                            <input type="number" step="0.01" min="0" name="pension" class="form-control" value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Other deductions (£)</label>
                            <input type="number" step="0.01" min="0" name="other_deductions" class="form-control" value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Payslip PDF</label>
                            <input type="file" name="document" class="form-control" accept=".pdf,application/pdf">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Admin notes</label>
                            <textarea name="notes" rows="2" class="form-control"></textarea>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input type="checkbox" name="is_published" class="form-check-input" id="is_published" checked>
                                <label class="form-check-label" for="is_published">Publish to employee (visible in their portal)</label>
                            </div>
                        </div>
                    </div>
                    <p class="text-muted small mt-3 mb-0">Net pay is calculated automatically from gross minus deductions.</p>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Save payslip</button>
                        <a href="{% url 'panel:hr_payslip_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
